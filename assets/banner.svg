<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff"/><stop offset="50%" stop-color="#bc8cff"/><stop offset="100%" stop-color="#39d353"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(33, 38, 45, 0.85)"/><stop offset="100%" stop-color="rgba(22, 27, 34, 0.7)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulse{0%{transform:scale(.9);opacity:.25}50%{transform:scale(1.15);opacity:.5}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(8px)}}@keyframes scan{0%{transform:translateX(0);opacity:.1}50%{opacity:.35}}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:url(#primaryGrad);letter-spacing:-.5px}.subtitle-text{font-weight:500;font-size:19px;fill:#8b949e;letter-spacing:.2px}.badge-text{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-weight:600;font-size:13px;fill:#c9d1d9}.pulse-orb{animation:pulse 4s ease-in-out infinite alternate}.orbit-particle{animation:floatParticle 6s ease-in-out infinite alternate}.scanner-beam{animation:scan 8s linear infinite}</style></defs><rect width="100%" height="100%" fill="url(#bgGrad)"/><rect width="100%" height="100%" fill="url(#grid)"/><g class="pulse-orb" style="transform-origin:200px 150px"><circle cx="200" cy="150" r="140" fill="#58a6ff" filter="url(#glow)" opacity=".3"/></g><g class="pulse-orb" style="transform-origin:950px 220px;animation-delay:-2s"><circle cx="950" cy="220" r="160" fill="#bc8cff" filter="url(#glow)" opacity=".25"/></g><g class="pulse-orb" style="transform-origin:600px 350px;animation-delay:-1s"><circle cx="600" cy="350" r="120" fill="#238636" filter="url(#glow)" opacity=".2"/></g><rect width="120" height="420" x="50" y="0" fill="url(#primaryGrad)" class="scanner-beam" filter="url(#glow)" opacity=".08"/><g fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"><path d="M 120 70 L 220 120 L 320 80 L 400 140"/><path d="M 800 320 L 900 270 L 1000 310 L 1080 250"/></g><circle cx="120" cy="70" r="4" fill="#58a6ff"/><circle cx="220" cy="120" r="5" fill="#bc8cff"/><circle cx="320" cy="80" r="4" fill="#39d353"/><circle cx="900" cy="270" r="5" fill="#58a6ff"/><circle cx="1000" cy="310" r="4" fill="#bc8cff"/><g class="orbit-particle" transform="translate(850, 75)"><rect width="290" height="180" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#glow)" rx="12"/><circle cx="24" cy="22" r="5" fill="#ff5f56"/><circle cx="42" cy="22" r="5" fill="#ffbd2e"/><circle cx="60" cy="22" r="5" fill="#27c93f"/><rect width="150" height="9" x="20" y="48" fill="#58a6ff" opacity=".8" rx="4"/><rect width="220" height="8" x="20" y="68" fill="#8b949e" opacity=".5" rx="4"/><rect width="180" height="8" x="40" y="86" fill="#bc8cff" opacity=".7" rx="4"/><rect width="140" height="8" x="40" y="104" fill="#39d353" opacity=".7" rx="4"/><rect width="90" height="8" x="20" y="124" fill="#8b949e" opacity=".4" rx="4"/><rect width="120" height="14" x="20" y="148" fill="rgba(88, 166, 255, 0.2)" stroke="#58a6ff" stroke-width="1" rx="4"/><text x="32" y="159" fill="#58a6ff" font-family="monospace" font-size="10">&gt; FIM stream ⚡</text></g><g transform="translate(80, 115)"><rect width="260" height="28" x="0" y="-38" fill="rgba(88, 166, 255, 0.15)" stroke="#58a6ff" stroke-width="1.2" rx="14"/><text x="16" y="-20" fill="#58a6ff" class="badge-text">⚡ 2026 AI DEV ECOSYSTEM</text><text x="0" y="32" class="title-text">Awesome AI Coding Assistant</text><text x="0" y="80" fill="#e6edf3" class="title-text">&amp; Lightweight Copilots</text><text x="0" y="126" class="subtitle-text">Curated guide to fast inline autocomplete, low-RAM editor plugins,</text><text x="0" y="152" class="subtitle-text">local Fill-in-the-Middle (FIM) inference &amp; minimalist terminal agents.</text></g><g><g class="orbit-particle" transform="translate(80, 340)"><rect width="150" height="36" x="0" y="0" fill="rgba(33, 38, 45, 0.9)" stroke="#58a6ff" stroke-width="1.2" rx="18"/><text x="22" y="23" class="badge-text">⚡ Sub-100ms FIM</text></g><g class="orbit-particle" style="animation-delay:-2s" transform="translate(80, 340)"><rect width="170" height="36" x="165" y="0" fill="rgba(33, 38, 45, 0.9)" stroke="#bc8cff" stroke-width="1.2" rx="18"/><text x="187" y="23" class="badge-text">🔒 100% Offline LLM</text></g><g class="orbit-particle" style="animation-delay:-4s" transform="translate(80, 340)"><rect width="165" height="36" x="350" y="0" fill="rgba(33, 38, 45, 0.9)" stroke="#39d353" stroke-width="1.2" rx="18"/><text x="372" y="23" class="badge-text">💻 Minimalist TUIs</text></g><g class="orbit-particle" style="animation-delay:-1s" transform="translate(80, 340)"><rect width="160" height="36" x="530" y="0" fill="rgba(33, 38, 45, 0.9)" stroke="#d29922" stroke-width="1.2" rx="18"/><text x="552" y="23" class="badge-text">🧩 Neovim &amp; VS Code</text></g></g></svg>
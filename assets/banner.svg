<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(33, 38, 45, 0.85)"/>
      <stop offset="100%" stop-color="rgba(22, 27, 34, 0.7)"/>
    </linearGradient>

    <!-- Animated Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#primaryGrad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #8b949e;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 13px;
        fill: #c9d1d9;
      }
      .pulse-orb {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .orbit-particle {
        animation: floatParticle 6s ease-in-out infinite alternate;
      }
      .scanner-beam {
        animation: scan 8s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.9); opacity: 0.25; }
        50% { transform: scale(1.15); opacity: 0.5; }
        100% { transform: scale(0.9); opacity: 0.25; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-12px) translateX(8px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes scan {
        0% { transform: translateX(0px); opacity: 0.1; }
        50% { opacity: 0.35; }
        100% { transform: translateX(1100px); opacity: 0.1; }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dynamic Glowing Orbs in the Background (Behind text) -->
  <g class="pulse-orb" style="transform-origin: 200px 150px;">
    <circle cx="200" cy="150" r="140" fill="#58a6ff" filter="url(#glow)" opacity="0.3"/>
  </g>
  <g class="pulse-orb" style="transform-origin: 950px 220px; animation-delay: -2s;">
    <circle cx="950" cy="220" r="160" fill="#bc8cff" filter="url(#glow)" opacity="0.25"/>
  </g>
  <g class="pulse-orb" style="transform-origin: 600px 350px; animation-delay: -1s;">
    <circle cx="600" cy="350" r="120" fill="#238636" filter="url(#glow)" opacity="0.2"/>
  </g>

  <!-- Dynamic Scanning Beam Animation -->
  <rect class="scanner-beam" x="50" y="0" width="120" height="420" fill="url(#primaryGrad)" opacity="0.08" filter="url(#glow)"/>

  <!-- Tech Geometric Constellations -->
  <g stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" fill="none">
    <path d="M 120 70 L 220 120 L 320 80 L 400 140" />
    <path d="M 800 320 L 900 270 L 1000 310 L 1080 250" />
  </g>
  <circle cx="120" cy="70" r="4" fill="#58a6ff" />
  <circle cx="220" cy="120" r="5" fill="#bc8cff" />
  <circle cx="320" cy="80" r="4" fill="#39d353" />
  <circle cx="900" cy="270" r="5" fill="#58a6ff" />
  <circle cx="1000" cy="310" r="4" fill="#bc8cff" />

  <!-- Code Preview Floating Card Right Side -->
  <g class="orbit-particle" transform="translate(850, 75)">
    <rect width="290" height="180" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="24" cy="22" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="60" cy="22" r="5" fill="#27c93f"/>
    <rect x="20" y="48" width="150" height="9" rx="4" fill="#58a6ff" opacity="0.8"/>
    <rect x="20" y="68" width="220" height="8" rx="4" fill="#8b949e" opacity="0.5"/>
    <rect x="40" y="86" width="180" height="8" rx="4" fill="#bc8cff" opacity="0.7"/>
    <rect x="40" y="104" width="140" height="8" rx="4" fill="#39d353" opacity="0.7"/>
    <rect x="20" y="124" width="90" height="8" rx="4" fill="#8b949e" opacity="0.4"/>
    <rect x="20" y="148" width="120" height="14" rx="4" fill="rgba(88, 166, 255, 0.2)" stroke="#58a6ff" stroke-width="1"/>
    <text x="32" y="159" font-family="monospace" font-size="10" fill="#58a6ff">&gt; FIM stream ⚡</text>
  </g>

  <!-- Foreground Header Text (Never Obscured) -->
  <g transform="translate(80, 115)">
    <!-- Category Pill -->
    <rect x="0" y="-38" width="260" height="28" rx="14" fill="rgba(88, 166, 255, 0.15)" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="16" y="-20" class="badge-text" fill="#58a6ff">⚡ 2026 AI DEV ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="32" class="title-text">Awesome AI Coding Assistant</text>
    <text x="0" y="80" class="title-text" fill="#e6edf3">&amp; Lightweight Copilots</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="126" class="subtitle-text">Curated guide to fast inline autocomplete, low-RAM editor plugins,</text>
    <text x="0" y="152" class="subtitle-text">local Fill-in-the-Middle (FIM) inference &amp; minimalist terminal agents.</text>
  </g>

  <!-- Feature Pills Bottom Row -->
  <g transform="translate(80, 340)">
    <!-- Pill 1 -->
    <g class="orbit-particle">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="rgba(33, 38, 45, 0.9)" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="22" y="23" class="badge-text">⚡ Sub-100ms FIM</text>
    </g>
    <!-- Pill 2 -->
    <g class="orbit-particle" style="animation-delay: -2s;">
      <rect x="165" y="0" width="170" height="36" rx="18" fill="rgba(33, 38, 45, 0.9)" stroke="#bc8cff" stroke-width="1.2"/>
      <text x="187" y="23" class="badge-text">🔒 100% Offline LLM</text>
    </g>
    <!-- Pill 3 -->
    <g class="orbit-particle" style="animation-delay: -4s;">
      <rect x="350" y="0" width="165" height="36" rx="18" fill="rgba(33, 38, 45, 0.9)" stroke="#39d353" stroke-width="1.2"/>
      <text x="372" y="23" class="badge-text">💻 Minimalist TUIs</text>
    </g>
    <!-- Pill 4 -->
    <g class="orbit-particle" style="animation-delay: -1s;">
      <rect x="530" y="0" width="160" height="36" rx="18" fill="rgba(33, 38, 45, 0.9)" stroke="#d29922" stroke-width="1.2"/>
      <text x="552" y="23" class="badge-text">🧩 Neovim &amp; VS Code</text>
    </g>
  </g>
</svg>
